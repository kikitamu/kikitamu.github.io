<script>
(() => {
  const KEY = 'kikitamu-minigames-pass', WANT = 'f250eb81';
  const hash = w => {
    const s = 'kikitamu-minigames:' + w.normalize('NFKC').trim().toLowerCase();
    let h = 0x811c9dc5;
    for (let i = 0; i < s.length; i++) { h ^= s.charCodeAt(i); h = Math.imul(h, 0x01000193) >>> 0; }
    return h.toString(16).padStart(8, '0');
  };
  // replace this little page with the real one (the address, including #join=..., stays as it is)
  const show = () => {
    const bin = atob(document.getElementById('page').textContent.trim());
    const html = new TextDecoder().decode(Uint8Array.from(bin, c => c.charCodeAt(0)));
    document.open(); document.write(html); document.close();
  };
  let saved = null;
  try { saved = localStorage.getItem(KEY); } catch {}
  if (saved === WANT) { document.addEventListener('DOMContentLoaded', show); return; }
  const gate = document.getElementById('gate'), pw = document.getElementById('pw'), msg = document.getElementById('msg');
  gate.hidden = false; pw.focus();
  document.getElementById('f').addEventListener('submit', e => {
    e.preventDefault();
    if (hash(pw.value) !== WANT) { msg.textContent = '合言葉が違います。'; pw.select(); return; }
    try { localStorage.setItem(KEY, WANT); } catch {}
    show();
  });
})();
</script>
